name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Sin permisos de escritura: ningún job necesita empujar nada al repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Types · Tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run deps:check
      - run: npm run test -- --coverage
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage
          path: coverage/

  gitleaks:
    name: Secretos en el historial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # historial completo: sin esto solo escanea el último commit
      # Binario en vez de gitleaks-action (lección heredada de WhatsApp-Modular):
      # la action necesita permisos de escritura para comentar en PRs y falla
      # con el token de solo lectura de los PRs de Dependabot.
      - name: Instalar gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Escanear historial completo
        run: gitleaks detect --redact --verbose

  # ---------------------------------------------------------------------------
  # Seguridad estática del estándar DevSecOps (stack solo-ci): Gitleaks, Semgrep,
  # Trivy, auditoría de npm y Checkov sobre los workflows. La configuración vive
  # en .devsecops.yml y en .github/ (copias del estándar). CodeQL va aparte, en
  # codeql.yml.
  # ---------------------------------------------------------------------------
  seguridad-estatica:
    name: seguridad-estatica
    permissions:
      contents: read
      # security-events: write solo lo usa el reusable cuando subir_sarif = true.
      # pull-requests: read lo pide el job `secretos` del reusable. Un job
      # llamador no puede conceder menos de lo que el reusable pide.
      pull-requests: read
      security-events: write
      actions: read
    uses: ./.github/workflows/_reusable-security.yml
    with:
      ruta: '.'
      stack: auto
      bloquear_en: ${{ vars.BLOQUEAR_EN || 'CRITICAL,HIGH' }}
      subir_sarif: ${{ github.event.repository.visibility == 'public' || vars.GHAS_ENABLED == 'true' }}
    # Mínimo privilegio: solo los dos secretos que el reusable declara, ambos
    # opcionales. Nunca `secrets: inherit`.
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # ---------------------------------------------------------------------------
  # compuerta-pr: el ÚNICO status check que exige el ruleset de main. Agrega la
  # calidad (verify), el escaneo de secretos propio (gitleaks) y la seguridad
  # estática del estándar. `if: always()` para que un job saltado o fallido
  # bloquee en vez de dejar la compuerta sin publicar.
  # ---------------------------------------------------------------------------
  compuerta-pr:
    name: compuerta-pr
    needs: [verify, gitleaks, seguridad-estatica]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar resultados de calidad y seguridad
        env:
          R_VERIFY: ${{ needs.verify.result }}
          R_GITLEAKS: ${{ needs.gitleaks.result }}
          R_SEGURIDAD: ${{ needs.seguridad-estatica.result }}
        run: |
          set -euo pipefail
          echo "verify=$R_VERIFY | gitleaks=$R_GITLEAKS | seguridad-estatica=$R_SEGURIDAD"
          for r in "$R_VERIFY" "$R_GITLEAKS" "$R_SEGURIDAD"; do
            if [[ "$r" != "success" ]]; then
              echo "::error::compuerta-pr bloqueada: algún job requerido no terminó en success"
              exit 1
            fi
          done
          echo "compuerta-pr: aprobada"
