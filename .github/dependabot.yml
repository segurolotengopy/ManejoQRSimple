version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/La_Paz
    # Espera antes de proponer una versión recién publicada: un paquete
    # comprometido se detecta casi siempre en las primeras horas, que es justo
    # cuando Dependabot lo propondría. No retrasa las actualizaciones de
    # seguridad. El SAST del estándar marca su ausencia (dependabot-missing-cooldown).
    # semver-*-days solo vale en ecosistemas que versionan con semver.
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    groups:
      dev-menores:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # Runtime fijo en Node 22 LTS (mismo criterio que WhatsApp-Modular)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Sin semver-*-days: las acciones no versionan con semver y Dependabot
    # rechazaría el archivo entero.
    cooldown:
      default-days: 7
